<!-- @dsCard group="Colors" viewport="700x170" name="Papel y tinta" subtitle="Neutros de base: fondo, superficies, texto y líneas" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>.sw{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--white)}.sw i{display:block;height:56px}.sw p{padding:8px 10px;font-size:10px;color:var(--muted);line-height:1.5}.sw b{color:var(--ink);font-weight:500}</style>
</head>
<body style="margin:0;padding:14px;background:var(--paper)"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
<div class="sw"><i style="background:var(--paper)"></i><p>--paper<br><b>#F9F9F9</b></p></div>
<div class="sw"><i style="background:var(--surface)"></i><p>--surface<br><b>#F1F1F1</b></p></div>
<div class="sw"><i style="background:var(--white)"></i><p>--white<br><b>#FFFFFF</b></p></div>
<div class="sw"><i style="background:var(--line)"></i><p>--line<br><b>#DFDFDF</b></p></div>
<div class="sw"><i style="background:var(--muted)"></i><p>--muted<br><b>#6B6B6B</b></p></div>
<div class="sw"><i style="background:var(--ink)"></i><p>--ink<br><b>#1F1F1F</b></p></div>
</div></body></html>
