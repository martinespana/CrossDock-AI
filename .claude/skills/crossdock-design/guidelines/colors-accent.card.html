<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>.sw{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--white)}.sw i{display:block;height:56px}.sw p{padding:8px 10px;font-size:10px;color:var(--muted);line-height:1.5}.sw b{color:var(--ink);font-weight:500}</style>
</head>
<body style="margin:0;padding:14px;background:var(--paper)"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
<div class="sw"><i style="background:#C5EE9C"></i><p>lime (default)<br><b>#C5EE9C</b></p></div>
<div class="sw"><i style="background:#315CFD"></i><p>cobalt<br><b>#315CFD</b></p></div>
<div class="sw"><i style="background:#007F78"></i><p>petrol<br><b>#007F78</b></p></div>
<div class="sw"><i style="background:#E97435"></i><p>orange<br><b>#E97435</b></p></div>
<div class="sw"><i style="background:#F4D83A"></i><p>yellow<br><b>#F4D83A</b></p></div>
</div></body></html>
